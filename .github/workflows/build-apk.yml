name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Inspect official SU-555 logo assets
        run: |
          curl -L --fail --silent --show-error https://gcsu-555.ru/ru/ -o /tmp/su555.html
          echo "=== HEADER LOGO HTML ==="
          grep -A35 -B5 'class="header__logo"' /tmp/su555.html | head -120 || true
          echo "=== FOOTER LOGO HTML ==="
          grep -A35 -B5 'class="footer__logo"' /tmp/su555.html | head -100 || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ustranenie-zamechaniy.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ustranenie-zamechaniy
          path: Ustranenie-zamechaniy.apk

      - name: Publish latest beta release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release delete beta-latest --cleanup-tag --yes || true;
          gh release create beta-latest Ustranenie-zamechaniy.apk
          --target "${GITHUB_SHA}"
          --title "Устранение замечаний — beta 0.1.0"
          --notes "Автоматическая сборка APK. Загрузка XLSX, аналитика просрочек, квартиры, графики и экспорт XLSX."
          --prerelease

name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ustranenie-zamechaniy.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ustranenie-zamechaniy
          path: Ustranenie-zamechaniy.apk

      - name: Publish latest beta release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release delete beta-latest --cleanup-tag --yes || true;
          gh release create beta-latest Ustranenie-zamechaniy.apk
          --target "${GITHUB_SHA}"
          --title "Устранение замечаний — beta 0.4.0"
          --notes "Рабочий журнал beta 0.4.0: локальная база, добавление и редактирование замечаний, архив, история изменений, фото до/после, быстрые статусы, массовые изменения, режим обхода квартир, ежедневная сводка, группировка МКД/СТМ в СМУ и электрики/сантехники в УИР."
          --prerelease

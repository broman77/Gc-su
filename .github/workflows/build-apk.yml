name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Fetch official SU-555 logo assets
        run: |
          mkdir -p official-brand
          curl -L --fail --silent --show-error https://gcsu-555.ru/upload/iblock/046/lklgnno719qoagg793n5p2x4t2bgkxb4.svg -o official-brand/su555-logo.svg
          curl -L --fail --silent --show-error https://gcsu-555.ru/upload/iblock/f05/v1rt1kphsa7m7po3ema0dzvbzc2rvkrv.svg -o official-brand/su555-logo-mobile.svg
          curl -L --fail --silent --show-error https://gcsu-555.ru/upload/iblock/41c/sz3ct0yzi9j9q85vdstiwqwmx68lwh3f.svg -o official-brand/su555-logo-footer.svg
          echo "DESKTOP_SVG_BASE64=$(base64 -w0 official-brand/su555-logo.svg)"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Ustranenie-zamechaniy.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ustranenie-zamechaniy
          path: Ustranenie-zamechaniy.apk

      - name: Publish latest beta release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release delete beta-latest --cleanup-tag --yes || true;
          gh release create beta-latest Ustranenie-zamechaniy.apk
          --target "${GITHUB_SHA}"
          --title "Устранение замечаний — beta 0.1.0"
          --notes "Автоматическая сборка APK. Загрузка XLSX, аналитика просрочек, квартиры, графики и экспорт XLSX."
          --prerelease
